<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Interactive map of the Top 30 US Universities. Explore America's leading academic institutions with detailed information about rankings, programs, and locations.">
    <meta name="keywords" content="top US universities, best American colleges, university rankings, Harvard, MIT, Stanford, Princeton, Yale, higher education map">
    <title>Top 30 US Universities - Interactive Map | NRIDL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    
    <!-- Site CSS -->
    <link rel="stylesheet" href="css/main.css?v=1.5">
    <link rel="stylesheet" href="css/navigation.css?v=1.5">

    <style>
        /* Hero-specific styles that use custom background pattern */
        /* Hero Section */
        .universities-hero {
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 50%, #1a202c 100%);
            padding: clamp(6rem, 12vw, 10rem) 0 clamp(4rem, 8vw, 6rem);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .universities-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        
        .universities-hero .container {
            position: relative;
            z-index: 1;
        }
        
        .hero-badge {
            display: inline-block;
            font-size: 0.875rem;
            color: #90cdf4;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: rgba(144, 205, 244, 0.1);
            border-radius: 30px;
            border: 1px solid rgba(144, 205, 244, 0.2);
        }
        
        .universities-hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: #ffffff;
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        
        .universities-hero p {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
            font-weight: 300;
        }
        
        /* Map Section */
        .map-section {
            background: #f8f9fa;
            padding: clamp(3rem, 6vw, 5rem) 0;
        }
        
        .map-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .map-wrapper {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        
        .map-header {
            padding: 1.5rem 2rem;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .map-header h2 {
            font-size: 1.25rem;
            color: #1a202c;
            font-weight: 500;
            margin: 0;
        }
        
        .map-legend {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #4a5568;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .legend-dot.top-10 {
            background: #c53030;
        }
        
        .legend-dot.top-20 {
            background: #dd6b20;
        }
        
        .legend-dot.top-30 {
            background: #2b6cb0;
        }
        
        #us-map {
            height: 85vh;
            min-height: 700px;
            max-height: 900px;
            width: 100%;
            background: #e8f4f8;
        }
        
        /* Custom Leaflet Popup Styles */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.85);
        }
        
        .leaflet-popup-content {
            margin: 0;
            min-width: 380px;
            max-width: 420px;
        }
        
        .university-popup {
            font-family: 'Inter', sans-serif;
        }
        
        .popup-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .popup-rank {
            display: inline-block;
            background: #1a365d;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .popup-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.3;
        }
        
        .popup-body {
            padding: 1rem 1.5rem;
        }
        
        .popup-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .popup-info-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .popup-info-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: #4a5568;
        }
        
        .popup-info-text {
            font-size: 0.875rem;
            color: #4a5568;
            line-height: 1.5;
        }
        
        .popup-info-text strong {
            color: #1a202c;
            font-weight: 600;
        }
        
        .popup-section-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 0.75rem 0;
        }
        
        .popup-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .popup-rates {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .popup-rate-box {
            flex: 1;
            background: #f7fafc;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        
        .popup-rate-box.early {
            border-left: 3px solid #38a169;
        }
        
        .popup-rate-box.rd {
            border-left: 3px solid #3182ce;
        }
        
        .rate-label {
            display: block;
            font-size: 0.7rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        
        .rate-value {
            display: block;
            font-size: 1rem;
            font-weight: 700;
            color: #1a202c;
        }
        
        .popup-rate-note {
            font-size: 0.75rem;
            color: #718096;
            font-style: italic;
            text-align: center;
            margin-top: 0.5rem;
        }
        
        .popup-footer {
            padding: 0.75rem 1.5rem;
            background: #f7fafc;
            border-top: 1px solid #e2e8f0;
        }
        
        .popup-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2b6cb0;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .popup-link:hover {
            color: #1a365d;
        }
        
        /* Custom Marker Styles */
        .custom-marker-wrapper {
            background: transparent !important;
            border: none !important;
        }
        
        .custom-marker {
            width: 32px;
            height: 32px;
            background: #c53030;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .custom-marker:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
        
        .custom-marker.top-10 {
            background: #c53030;
        }
        
        .custom-marker.top-20 {
            background: #dd6b20;
        }
        
        .custom-marker.top-30 {
            background: #2b6cb0;
        }
        
        /* University List Section */
        .university-list-section {
            background: #ffffff;
            padding: clamp(4rem, 8vw, 6rem) 0;
        }
        
        .section-header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 3rem;
        }
        
        .section-header h2 {
            font-size: clamp(1.75rem, 3vw, 2.5rem);
            color: #1a202c;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        .section-header p {
            font-size: 1.125rem;
            color: #4a5568;
            line-height: 1.8;
        }
        
        .university-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .university-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            cursor: pointer;
            flex-wrap: wrap;
        }
        
        .university-card:hover {
            border-color: #2b6cb0;
            box-shadow: 0 4px 12px rgba(43, 108, 176, 0.15);
            transform: translateY(-2px);
        }
        
        .card-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            color: white;
            flex-shrink: 0;
        }
        
        .card-rank.top-10 {
            background: #c53030;
        }
        
        .card-rank.top-20 {
            background: #dd6b20;
        }
        
        .card-rank.top-30 {
            background: #2b6cb0;
        }
        
        .card-content {
            flex: 1;
        }
        
        .card-name {
            font-size: 1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 0.25rem;
        }
        
        .card-location {
            font-size: 0.875rem;
            color: #718096;
        }
        
        .card-toggle {
            margin-left: auto;
            color: #718096;
            transition: transform 0.3s ease;
        }
        
        .university-card.expanded .card-toggle {
            transform: rotate(180deg);
        }
        
        .card-expanded-content {
            display: none;
            padding: 1.25rem 1.5rem;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
            margin: 1rem -1.5rem -1.5rem -1.5rem;
            border-radius: 0 0 12px 12px;
        }
        
        .university-card.expanded .card-expanded-content {
            display: block;
        }
        
        .expanded-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem 1.5rem;
            margin-bottom: 1rem;
        }
        
        .expanded-info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #4a5568;
        }
        
        .expanded-info-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #718096;
        }
        
        .expanded-info-item strong {
            color: #1a202c;
            font-weight: 600;
        }
        
        .expanded-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1rem 0 0.5rem 0;
            padding-top: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .expanded-rates {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .expanded-rate-box {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        
        .expanded-rate-box.early {
            border-left: 3px solid #38a169;
        }
        
        .expanded-rate-box.rd {
            border-left: 3px solid #3182ce;
        }
        
        .expanded-rate-label {
            display: block;
            font-size: 0.65rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .expanded-rate-value {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a202c;
        }
        
        .expanded-rate-note {
            font-size: 0.75rem;
            color: #718096;
            font-style: italic;
            text-align: center;
            margin-bottom: 0.75rem;
        }
        
        .expanded-notable {
            font-size: 0.875rem;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #ffffff;
            border-radius: 8px;
            border-left: 3px solid #ecc94b;
        }
        
        .expanded-actions {
            display: flex;
            gap: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .expanded-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #2b6cb0;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .expanded-link:hover {
            color: #1a365d;
        }
        
        .expanded-link svg {
            width: 16px;
            height: 16px;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            #us-map {
                height: 70vh;
                min-height: 500px;
            }
            
            .map-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .university-grid {
                grid-template-columns: 1fr;
            }
            
            .leaflet-popup-content {
                min-width: 300px;
                max-width: 340px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav id="main-nav"></nav>

    <!-- Hero Section -->
    <section class="universities-hero">
        <div class="container">
            <span class="hero-badge">Educational Excellence</span>
            <h1>Top 30 US Universities</h1>
            <p>Explore America's most prestigious academic institutions through our interactive map. Discover rankings, admission info, and what makes each university exceptional.</p>
        </div>
    </section>

    <!-- Interactive Map Section -->
    <section class="map-section">
        <h2>Interactive University Map</h2>
        <div class="map-container">
            <div id="universities-map"></div>
        </div>
    </section>

    <!-- Complete Rankings List -->
    <section class="rankings-section">
        <h2>Complete Rankings List</h2>
        <p class="rankings-subtitle">2025 USNWR Top 30 US Ranking</p>
        
        <!-- Search and Filter Controls -->
        <div class="universities-controls">
            <div class="universities-search">
                <svg class="universities-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="universities-search" placeholder="Search universities...">
            </div>
            <div class="universities-filter">
                <button class="universities-filter-btn active" data-filter="all">All</button>
                <button class="universities-filter-btn" data-filter="private">Private</button>
                <button class="universities-filter-btn" data-filter="public">Public</button>
            </div>
        </div>
        
        <!-- University Cards Grid -->
        <div id="universities-grid" class="universities-grid">
            <!-- Cards will be dynamically generated by JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/navigation.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/universities.js?v=1.0"></script>
